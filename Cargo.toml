[workspace]
resolver = "3"
members = ["crates/trainer-core", "crates/trainer-audio", "crates/trainer-mcp", "crates/trainer-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
trainer-core = { path = "crates/trainer-core" }
trainer-audio = { path = "crates/trainer-audio", default-features = false }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
dirs = "7.0.0"
rustfft = "6.4.1"
rtrb = "0.4.0"
cpal = "0.18.2"
rustysynth = "1.3.8"
hound = "3.5.1"
crossbeam-channel = "0.5.17"
parking_lot = "0.13.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros", "schemars"] }
base64 = "0.23.1"
midly = { version = "0.5.3", default-features = false, features = ["std"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
