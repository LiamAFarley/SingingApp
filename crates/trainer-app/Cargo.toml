[package]
name = "trainer-app"
description = "Singing Trainer desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "singing-trainer"

[[bin]]
name = "singing-trainer"
path = "src/main.rs"

[lib]
name = "trainer_app"
path = "src/lib.rs"

[features]
default = ["asio"]
asio = ["trainer-audio/asio"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
trainer-core.workspace = true
trainer-audio.workspace = true
trainer-mcp = { path = "../trainer-mcp" }
tauri = { version = "2.12.5", features = [] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
hound.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
