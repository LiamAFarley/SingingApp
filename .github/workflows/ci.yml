name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev
      - name: Install npm packages
        run: npm ci
      - name: UI type check and build
        run: npm run build
      - name: Tests
        run: cargo test --workspace
      - name: TypeScript bindings match the Rust types
        run: |
          git add -N ui/src/bindings
          git diff --exit-code -- ui/src/bindings

  windows:
    name: Windows (tests, ASIO, installer)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p trainer-core -p trainer-audio -p trainer-mcp
      - name: Install npm packages
        run: npm ci
      - name: Fetch the default SoundFont
        shell: pwsh
        run: ./scripts/fetch-soundfont.ps1
      - name: Build the app and installers (ASIO enabled)
        run: npx tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: singing-trainer-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
